 "url": "https://tender4arab.com/TenderDetails.aspx?id=93481", "title": "إعلان إستقطاب خبير في مجال الشركات الصغيرة والناشئة (أفراد / شركات)", "org": null, "org_type": null, "location_raw": "قطاع غزة", "sector_raw": "استشارات وتدريب", "published_rel": "04/07/2026", "deadline_raw": "09/07/2026", "detail_excerpt": null, "id": "tender4arab.com:93481", "region": "gaza", "city": null, "sector": "خدمات استشارية", "deadline": "2026-07-09"}]};
const CTA_EVERY = 4; // بانر التنبيهات بعد كل N بطاقات
const state = { region:'gaza', tab:'all', sector:null, q:'' };

const $ = s => document.querySelector(s);
const today = new Date(); today.setHours(0,0,0,0);
const MS_DAY = 86400000;

function daysLeft(d){ if(!d) return null; return Math.round((new Date(d+'T00:00:00') - today)/MS_DAY); }
function stateClass(n){ if(n===null) return 'st-off'; if(n<0) return 'st-off'; if(n<=4) return 'st-urgent'; if(n<=8) return 'st-warn'; return 'st-ok'; }
function stateText(n){ if(n===null) return 'راجع المصدر'; if(n<0) return 'مغلق'; if(n===0) return 'يغلق اليوم!'; if(n===1) return 'يغلق غداً'; return 'باقي '+n+(n<=10?' أيام':' يوم'); }
const AV = ['a1','a2','a3','a4'];
function avatar(it,i){ const base=(it.org||it.title||'؟').replace(/^(جمعية|شركة|مؤسسة|بلدية|وزارة|هيئة|عطاء|توريد|استدراج)\s+/,'').trim(); return `<span class="avatar ${AV[i%4]}">${base[0]||'؟'}</span>`; }

function filtered(){
  return DATA.items.filter(it=>{
    if(state.region!=='all' && it.region!==state.region) return false;
    if(state.sector && it.sector!==state.sector) return false;
    const dl = daysLeft(it.deadline);
    if(dl!==null && dl<0) return false; // المغلق يختفي من العرض الافتراضي
    if(state.tab==='closing' && !(dl!==null && dl<=5)) return false;
    if(state.tab==='today' && !/اليوم|ساعة|ساعات|دقيقة|دقائق/.test(it.published_rel||'') && it.published_rel!==fmtToday()) return false;
    if(state.q){ const t=(it.title+' '+(it.org||'')+' '+(it.sector||'')+' '+(it.city||'')).toLowerCase(); if(!t.includes(state.q.toLowerCase())) return false; }
    return true;
  }).sort((a,b)=>(daysLeft(a.deadline)??999)-(daysLeft(b.deadline)??999));
}
function fmtToday(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }

function render(){
  const items = filtered();
  const regionName = state.region==='gaza'?'غزة':state.region==='west_bank'?'الضفة':'فلسطين';
  $('#banner-title').textContent='أهلاً!';
  $('#banner-sub').textContent=`في ${items.length} فرصة متاحة الآن في ${regionName}` + (state.sector?` ضمن «${state.sector}»`:'');
  $('#count').textContent = items.length ? `${items.length} فرصة — الأقرب إغلاقاً أولاً` : '';
  const cta = `<div class="cta"><b>خلّي الفرص تلاحقك، مش العكس</b><p>اختار قطاعك ومنطقتك مرة وحدة — وكل فرصة جديدة بتوصلك فوراً على تيليجرام، مجاناً.</p><a class="btn" href="#" onclick="alert('قناة التنبيهات قريباً — هاي نسخة معاينة');return false;">فعّل التنبيهات المجانية</a></div>`;
  let html='';
  items.forEach((it,i)=>{
    const dl=daysLeft(it.deadline);
    html+=`<a class="card" href="${it.url}" target="_blank" rel="noopener">
      <div class="cardrow">${avatar(it,i)}<div>
        <h3>${esc(it.title)}</h3>
        <div class="org">${esc(it.org||('عبر '+it.source))}${it.city?' · '+esc(it.city):''}${it.published_rel?' · '+esc(it.published_rel):''}</div>
      </div></div>
      <div class="cardfoot"><span class="sector">${esc(it.sector)}</span>
      <span class="state ${stateClass(dl)} num">${stateText(dl)}${it.deadline?' · '+it.deadline.split('-').reverse().join('/'):''}</span></div></a>`;
    if((i+1)%CTA_EVERY===0 && i<items.length-1) html+=cta;
  });
  if(!items.length) html=`<div class="empty">ما في نتائج بهالفلاتر حالياً.<br>جرّب توسّع البحث أو غيّر القطاع.</div>`;
  else if(items.length<=CTA_EVERY) html+=cta;
  $('#list').innerHTML=html;
}
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// sector chips من البيانات نفسها
(function(){
  const counts={};
  DATA.items.forEach(it=>{ counts[it.sector]=(counts[it.sector]||0)+1; });
  const sectors=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  $('#sectors').innerHTML=`<button class="on" data-s="">كل القطاعات</button>`+sectors.map(([s,c])=>`<button data-s="${esc(s)}">${esc(s)} (${c})</button>`).join('');
})();

document.body.addEventListener('click',e=>{
  const b=e.target.closest('button[data-r],button[data-t],button[data-s]'); if(!b) return;
  if(b.dataset.r!==undefined){ state.region=b.dataset.r; sel('#regions',b); }
  if(b.dataset.t!==undefined){ state.tab=b.dataset.t; sel('#tabs',b); }
  if(b.dataset.s!==undefined){ state.sector=b.dataset.s||null; sel('#sectors',b); }
  render();
});
function sel(root,b){ document.querySelectorAll(root+' button').forEach(x=>x.classList.toggle('on',x===b)); }
$('#q').addEventListener('input',e=>{ state.q=e.target.value.trim(); render(); });

$('#updated').textContent=(DATA.generated_at||'').replace('T',' ').replace('Z',' UTC');
render();
</script>
