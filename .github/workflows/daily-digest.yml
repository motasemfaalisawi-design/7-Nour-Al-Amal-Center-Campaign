name: الملخص اليومي للواتساب

on:
  schedule:
    - cron: "10 5 * * *"   # 05:10 UTC = 08:10 صباحاً بتوقيت غزة
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إرسال الملخص للمالك على تيليجرام
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_CHAT: ${{ secrets.TG_ADMIN_CHAT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 tender-platform/bot/digest.py

      - name: حفظ سجل الملخصات
        run: |
          git config user.name "tawreed-bot"
          git config user.email "actions@github.com"
          git add tender-platform/data/digested_ids.json
          if git diff --cached --quiet; then
            echo "لا تغيير"
          else
            git commit -m "سجل الملخص اليومي $(date -u +'%Y-%m-%d')"
            git push
          fi
