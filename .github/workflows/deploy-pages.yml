name: نشر الموقع

on:
  push:
    branches: [claude/gaza-market-business-2n74o6, main]
  workflow_run:
    workflows: ["تحديث بيانات العطاءات"]   # ينشر بعد كل جمع آلي
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: بناء الموقع بأحدث البيانات
        run: python3 tender-platform/site/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tender-platform/site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
